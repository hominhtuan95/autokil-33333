name: Build Auto Train 3Skill EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name AutoTrain_3Skill_Aegis_V25 AutoTrain_3Skill_Aegis_V25.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTrain_3Skill_Aegis_V25
          path: dist/AutoTrain_3Skill_Aegis_V25.exe
          if-no-files-found: error

